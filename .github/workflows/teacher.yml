name: Smart Tutor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: node --import tsx --test tests/schoolRecord.test.ts
      - run: bun run build
      - name: Check production server
        run: |
          NODE_ENV=production npm start &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/ | grep -q 'AI Smart Tutor'
      - name: Build the GitHub Pages preview
        run: bun run build --base=/The-teacher-/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
