name: Validate Smart Tutor

on:
  push:
    branches: [fix/code-login-navigation]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Vite production build
        run: npm run build
